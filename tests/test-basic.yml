name: Test basic usage with annotations file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create annotations JSON file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp"
          cat > "$GITHUB_WORKSPACE/tests/tmp/annotations.json" <<'EOF'
          [
            {
              "path": "src/main.js",
              "start_line": 1,
              "end_line": 1,
              "annotation_level": "warning",
              "message": "This is a test warning annotation"
            }
          ]
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          input: tests/tmp/annotations.json
          title: "Test Check"

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
