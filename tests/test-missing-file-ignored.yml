name: Test ignore missing file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure the nonexistent file does not exist
        run: |
          rm -f "$GITHUB_WORKSPACE/tests/tmp/nonexistent-annotations.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          input: tests/tmp/nonexistent-annotations.json
          ignore-missing-file: "true"

      - name: Assert action succeeded when file is missing and ignore-missing-file is true
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded gracefully when file is missing"
          else
            echo "FAIL: expected success when ignore-missing-file=true but got '$OUTCOME'"
            exit 1
          fi
